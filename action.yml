name: Check NGIS Policy
author: CrowdStrike
description:
  Calls Falcon Next-Gen Identity Security (NGIS) for a policy check using
  Falcon OAuth2 client credentials.
inputs:
  access_host:
    required: true
    description:
      The NGIS access hostname for your Falcon cloud, without scheme or path
      (e.g. access.crowdstrike.com, access.us-2.crowdstrike.com).
  client_id:
    required: true
    description: Falcon Client ID for OAuth2 authentication
  client_secret:
    required: true
    description: Falcon Client Secret for OAuth2 authentication
  app_id:
    required: true
    description:
      The ID of the GitHub protected system in the Falcon console. Store it as a
      repository variable.
  principal_id:
    required: true
    description:
      The identity of the principal executing this action. Typically a GitHub
      username or email address.
  asset_id:
    required: false
    description:
      The identifier of an asset for this policy check. Typically the repo from
      the action. At least one of 'asset_id' or 'action' is required.
  action:
    required: false
    description:
      An action to pass to NGIS. At least one of 'asset_id' or 'action' is
      required.
  bypass_mode:
    required: true
    description:
      Don't actually call NGIS, instead always return Allow. ~~WARNING~~ Setting
      this to true will disable using NGIS. Use for testing or break glass only.
    default: "false"

outputs:
  reason:
    description: Any decision reason output from the policy evaluation.
  decision:
    description: Policy decision as a boolean. (true = Allow, false = Deny)
runs:
  using: node24
  main: dist/index.js
