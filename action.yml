name: Check SGNL Policy
author: CrowdStrike
description: Calls SGNL for a policy check using Falcon OAuth2 client credentials.
inputs:
  access_host:
    required: true
    description: The SGNL access hostname (e.g. access.crowdstrike.com, access.us-2.crowdstrike.com)
  client_id:
    required: true
    description: Falcon Client ID for OAuth2 authentication
  client_secret:
    required: true
    description: Falcon Client Secret for OAuth2 authentication
  principal_id:
    required: true
    description:
      The identity of the principal executing this action. Typically a GitHub
      username or email address.
  asset_id:
    required: false
    description:
      The identifier of an asset for this policy check. Typically the repo from
      the action. At least one of 'asset_id' or 'action' is required.
  action:
    required: false
    description:
      An action to pass to SGNL. At least one of 'asset_id' or 'action' is
      required.
  bypass_mode:
    required: true
    description:
      Don't actually call SGNL, instead always return Allow. ~~WARNING~~ Setting
      this to true will disable using SGNL. Use for testing or break glass only.
    default: false

outputs:
  reason:
    description: Any decision reason output from the policy evaluation.
  decision:
    description: Policy decision as a boolean. (true = Allow, false = Deny)
runs:
  using: node20
  main: dist/index.js
